name: Docs test build (release/2.x)

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/2.*'
  pull_request:
    branches:
      - 'release/2.*'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/docs-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Determine target branch and Conan branch
        id: branches
        run: |
          target="${{ github.base_ref || github.ref_name }}"
          # Conan doesn't have patch branches, only major.minor (e.g. release/2.32),
          # so a docs patch branch like release/2.32.1 maps down to release/2.32.
          conan_branch=$(echo "$target" | cut -d'.' -f1,2)
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "conan_branch=$conan_branch" >> "$GITHUB_OUTPUT"

      - name: Clone Conan sources for autodoc
        run: git clone --single-branch -b "${{ steps.branches.outputs.conan_branch }}" --depth 1 https://github.com/conan-io/conan.git conan_sources

      - name: Install Conan sources
        run: |
          pip install -e conan_sources
          conan --version

      - name: Build HTML
        run: make html

      - name: Build LaTeX sources
        run: make latex

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ github.sha }}
          path: |
            _build/html
            _build/latex
          retention-days: 7
