name: Docs test build

on:
  workflow_dispatch:
  push:
    branches:
      - develop2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Conan sources for autodoc
        run: git clone --single-branch -b "${{ github.ref_name }}" --depth 1 https://github.com/conan-io/conan.git conan_sources

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e conan_sources
          conan --version

      - name: Build HTML
        run: make html

      - name: Build LaTeX sources
        run: make latex

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ github.sha }}
          path: |
            _build/html
            _build/latex
          retention-days: 7
