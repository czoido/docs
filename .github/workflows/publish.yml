name: Docs publish (artifact preview)

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma-separated branches to regenerate (e.g. master,release/2.32)'
        required: true
        default: 'master'
      pdf_branches:
        description: 'Comma-separated branches to regenerate PDF for (empty = regenerate for all requested branches)'
        required: false
        default: ''

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - id: set
        run: |
          json=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(',')))" "${{ github.event.inputs.branches }}")
          echo "branches=$json" >> "$GITHUB_OUTPUT"

  generate:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare-matrix.outputs.branches) }}
    steps:
      - name: Checkout docs (CI scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine if this branch needs PDF
        id: pdf_check
        run: |
          pdf_branches="${{ github.event.inputs.pdf_branches }}"
          branch="${{ matrix.branch }}"
          if [ -z "$pdf_branches" ] || echo ",$pdf_branches," | grep -q ",$branch,"; then
            echo "with_pdf=true" >> "$GITHUB_OUTPUT"
          else
            echo "with_pdf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install LaTeX (only for branches that need PDF)
        if: steps.pdf_check.outputs.with_pdf == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Prepare sources as worktree
        working-directory: .ci/scripts
        run: python3 prepare_sources.py --sources-folder=../../sources_folder --branches="${{ matrix.branch }}"

      - name: Generate documentation
        working-directory: .ci/scripts
        env:
          CONAN_WORKSPACE_ENABLE: will_break_next
        run: |
          with_pdf=""
          if [ "${{ steps.pdf_check.outputs.with_pdf }}" = "true" ]; then
            with_pdf="--with-pdf"
          fi
          python3 generate_documentation.py --sources-folder=../../sources_folder --branch="${{ matrix.branch }}" $with_pdf

      - name: Sanitize artifact name
        id: name
        run: echo "safe=$(echo '${{ matrix.branch }}' | tr '/.' '__')" >> "$GITHUB_OUTPUT"

      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: docs-output-${{ steps.name.outputs.safe }}
          path: sources_folder/output
          retention-days: 1

  assemble:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs (CI scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Download all generated outputs
        uses: actions/download-artifact@v4
        with:
          pattern: docs-output-*
          path: downloaded
          merge-multiple: true

      - name: Merge into sources_folder/output
        run: |
          mkdir -p sources_folder/output
          cp -a downloaded/. sources_folder/output/

      - name: Prepare gh-pages folder
        working-directory: .ci/scripts
        run: python3 prepare_gh_pages.py --sources-folder=../../sources_folder --gh-pages-folder=../../gh_pages_out

      - name: Replace HTML tags
        working-directory: .ci/scripts
        run: |
          IFS=',' read -ra BR <<< "${{ github.event.inputs.branches }}"
          for b in "${BR[@]}"; do
            python3 replace_html_tags.py --gh-pages-folder=../../gh_pages_out --branch="$b"
          done

      - name: Upload gh-pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-preview-${{ github.run_id }}
          path: gh_pages_out
          retention-days: 7
